apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
  namespace = "com.google.mlkit.genai.demo"
  compileSdk 36

  defaultConfig {
    applicationId "com.google.mlkit.genai.demo"
    minSdk 31
    targetSdk 34
    versionCode 1
    versionName '1.0'

    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }

  buildFeatures {
    compose true
  }

  buildTypes {
    configureEach {
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
      isDefault true
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    testBuildType "debug"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }

}

dependencies {
  implementation 'com.google.mlkit:genai-image-description:1.0.0-beta1'
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta5'
  implementation 'com.google.mlkit:genai-proofreading:1.0.0-beta1'
  implementation 'com.google.mlkit:genai-rewriting:1.0.0-beta1'
  implementation 'com.google.mlkit:genai-summarization:1.0.0-beta1'
  implementation 'com.google.mlkit:genai-embedding:1.0.0-alpha1'
  implementation 'com.google.mlkit:genai-agent:1.0.0-alpha1'
  implementation 'androidx.appfunctions:appfunctions:1.0.0-alpha13'
  ksp 'androidx.appfunctions:appfunctions-compiler:1.0.0-alpha13'
  implementation 'androidx.appsearch:appsearch:1.2.0-alpha01'
  implementation 'androidx.appsearch:appsearch-local-storage:1.2.0-alpha01'
  implementation 'androidx.concurrent:concurrent-futures-ktx:1.3.0'
  ksp 'com.google.mlkit:genai-schema-compiler:1.0.0-alpha2'

  implementation 'androidx.compose.runtime:runtime:1.7.6'
  implementation 'androidx.compose.ui:ui:1.7.6'
  implementation 'androidx.compose.ui:ui-graphics:1.7.6'
  implementation 'androidx.compose.ui:ui-tooling-preview:1.7.6'
  implementation 'androidx.compose.foundation:foundation:1.7.6'
  implementation 'androidx.compose.foundation:foundation-layout:1.7.6'
  implementation 'androidx.compose.material:material-icons-core:1.7.6'
  implementation 'androidx.compose.material:material-icons-extended:1.7.6'
  implementation 'androidx.compose.material3:material3:1.3.1'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2'

  implementation 'androidx.concurrent:concurrent-futures:1.3.0'
  implementation 'androidx.preference:preference-ktx:1.2.1'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'com.google.android.material:material:1.12.0'
  implementation 'com.google.guava:guava:32.0.1-jre'
  implementation 'com.opencsv:opencsv:4.6'
  implementation 'com.github.bumptech.glide:glide:5.0.5'
  annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'

  androidTestImplementation 'androidx.test:rules:1.6.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'com.google.truth:truth:1.1.3'
  androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
  androidTestImplementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2'
}

ksp {
  arg('appfunctions:generateV1Xml', 'true')
}

// Disable CheckAarMetadata since androidx.appfunctions:1.0.0-alpha13 AAR metadata
// specifies minAgpVersion=9.1.0 and minCompileSdk=37, while this sample builds
// cleanly against compileSdk 36 and AGP 8.9.1.
tasks.matching { it.name.startsWith("check") && it.name.endsWith("AarMetadata") }.configureEach {
  enabled = false
}
